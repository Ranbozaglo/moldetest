[build]
  # Build command for Vite
  command = "npm run build"
  
  # Publish directory (Vite's default output)
  publish = "dist"
  
  # Environment variables for production
  [build.environment]
    NODE_VERSION = "18"
    NPM_VERSION = "9"

# Redirect rules for SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://opjgytjlebfnhjzarvyy.supabase.co https://moldetest-ftxv.onrender.com;"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache API responses (short cache for dynamic content)
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Environment variables for production
[context.production.environment]
  VITE_APP_ENV = "production"
  VITE_API_BASE_URL = "https://moldetest-ftxv.onrender.com/api"
  VITE_SUPABASE_URL = "https://opjgytjlebfnhjzarvyy.supabase.co"
