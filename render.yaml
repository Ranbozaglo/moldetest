# Render Blueprint — frontend Static Site only.
# Backend API stays on the existing moldetest-ftxv Web Service (do not recreate here).

services:
  - type: web
    name: mold-testing-houston-frontend
    runtime: static
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: VITE_APP_ENV
        value: production
      - key: VITE_SUPABASE_URL
        value: https://opjgytjlebfnhjzarvyy.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wamd5dGpsZWJmbmhqemFydnl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTI1ODMzMzYsImV4cCI6MjA2ODE1OTMzNn0.SN7VpDUtsInqW_AUmP7fNaVKTgRkIZAJcyyVXlT8gJc
      - key: VITE_API_BASE_URL
        value: https://moldetest-ftxv.onrender.com/api

    # SPA: client-side routes must fall back to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
