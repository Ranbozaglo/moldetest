# Render Blueprint
# Frontend: Static Site (currently moldetest-F-Frontend / total-testing-diy.com)
# Backend: Flask Web Service — must stay live. Frontend calls /api/inspection on this host.
#
# Host status:
# - moldetest-67e6.onrender.com → LIVE healthy API (use this)
# - moldetest.onrender.com → suspended; do not use
# - moldetest-ftxv.onrender.com → deleted; do not use
# - After any new API hostname, set Static Site VITE_API_BASE_URL to https://<host>/api
#   and Manual Deploy → Clear build cache & deploy (Vite bakes env at build time).
# Never set VITE_API_BASE_URL to a literal placeholder like https://<your-api-host>.onrender.com/api.
# Frontend code rejects known-dead hosts (moldetest, moldetest-ftxv, placeholders)
# and falls back to moldetest-67e6 even if Render still has a stale VITE_API_BASE_URL.

services:
  - type: web
    name: moldetest
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT simple_main:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FRONTEND_URL
        value: https://total-testing-diy.com
      - key: CORS_ORIGINS
        value: https://total-testing-diy.com,https://www.total-testing-diy.com,https://moldetest-f-frontend.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: JWT_SECRET_KEY
        sync: false
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: KIT_STORAGE_BUCKET
        value: kit-fulfillment
      - key: STRIPE_BUY_URL_SPOT_CHECK
        sync: false
      - key: STRIPE_BUY_URL_EXTENDED
        sync: false
      - key: STRIPE_BUY_URL_FULL_HOUSE
        sync: false
      - key: STRIPE_PLINK_SPOT_CHECK
        sync: false
      - key: STRIPE_PLINK_EXTENDED
        sync: false
      - key: STRIPE_PLINK_FULL_HOUSE
        sync: false

  - type: web
    name: moldetest-F-Frontend
    runtime: static
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: VITE_APP_ENV
        value: production
      - key: VITE_SUPABASE_URL
        value: https://opjgytjlebfnhjzarvyy.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Must include /api (or host only — code normalizes either form)
      - key: VITE_API_BASE_URL
        value: https://moldetest-67e6.onrender.com/api

    # SPA: client-side routes must fall back to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
